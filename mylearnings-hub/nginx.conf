server {
    listen       8000;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compress text assets
    gzip              on;
    gzip_min_length   256;
    gzip_types        text/html text/css application/javascript image/svg+xml application/json;

    # Security headers
    add_header X-Content-Type-Options nosniff       always;
    add_header X-Frame-Options        SAMEORIGIN     always;
    add_header Referrer-Policy         strict-origin-when-cross-origin always;

    # Landing page
    location = / {
        try_files /index.html =404;
    }

    # Books library React app
    location /books/ {
        alias /usr/share/nginx/html/books/;
        try_files $uri $uri/ /books/index.html;

        # Handle React Router
        location ~ ^/books/.*$ {
            try_files $uri /books/index.html;
        }
    }

    # Books assets (CSS, JS)
    location /books/assets/ {
        alias /usr/share/nginx/html/books/assets/;
    }

    # Books API - proxy to Node.js server
    location /books/api/ {
        proxy_pass http://localhost:8650/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Plan routes
    location = /plans/python {
        try_files /plans/python.html =404;
    }

    location = /plans/docker {
        try_files /plans/docker.html =404;
    }

    location = /plans/backend-infra {
        try_files /plans/backend-infra.html =404;
    }

    location = /plans/laravel {
        try_files /plans/laravel.html =404;
    }

    location = /plans/rag {
        try_files /plans/rag.html =404;
    }

    location = /plans/ml {
        try_files /plans/ml.html =404;
    }

    location = /plans/rust {
        try_files /plans/rust.html =404;
    }

    location = /plans/n8n {
        try_files /plans/n8n.html =404;
    }

    # Cache static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cache for HTML files
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
