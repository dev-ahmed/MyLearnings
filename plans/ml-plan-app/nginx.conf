server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compress text assets
    gzip              on;
    gzip_min_length   256;
    gzip_types        text/html text/css application/javascript image/svg+xml;

    # Sensible security headers (no strict CSP, so Google Fonts still load)
    add_header X-Content-Type-Options nosniff       always;
    add_header X-Frame-Options        SAMEORIGIN     always;
    add_header Referrer-Policy         strict-origin-when-cross-origin always;

    # Single-page site: always resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Let the browser cache the page briefly (localStorage is separate from this)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
