version: '3.8'

services:
  books-viewer:
    build: .
    ports:
      - "8650:8650"
    volumes:
      - ../cookbooks:/app/cookbooks:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8650"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
